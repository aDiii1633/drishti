name: keep-warm

# The Render free instance spins down after ~15 min without inbound traffic, and
# the next request then eats a 30-60s cold start (Node boot + migrations on a
# throttled 0.1 vCPU box). Ping the health endpoint every ~10 min so the instance
# stays warm and sign-in / navigation stay fast.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health
        run: |
          for url in \
            "https://drishti-api-roed.onrender.com/api/v1/health" \
            "https://drishti-eight-pearl.vercel.app/api/v1/health"; do
            echo "GET $url"
            curl -sS -m 90 -o /dev/null -w "  -> %{http_code} in %{time_total}s\n" "$url" || true
          done
