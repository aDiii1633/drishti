# Render Blueprint for the DRISHTI API + storage host.
#
# The Vercel deployment (drishti-eight-pearl.vercel.app) serves the SPA and
# proxies /api/* and /manus-storage/* to this service via vercel.json rewrites,
# so the browser stays on one origin and the role-session cookie keeps working.
#
# Deploy: push to GitHub, then in Render -> New -> Blueprint, pick this repo.
# Render will prompt for the `sync: false` secrets below at deploy time.
#
# The persistent disk holds the SQLite database and uploaded answer-sheet
# files, so both survive restarts and redeploys. A disk requires a paid
# instance (Starter, ~$7/mo); the free plan has no disk and sleeps.

services:
  - type: web
    name: drishti-api
    runtime: node
    plan: starter
    region: singapore
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    preDeployCommand: "DATABASE_URL=$DEMO_DATABASE_URL pnpm exec drizzle-kit migrate"
    startCommand: pnpm start
    healthCheckPath: /
    disk:
      name: drishti-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: demo
      - key: DEMO_ACCESS_MODE
        value: "true"
      - key: DATABASE_URL
        value: file:/var/data/drishti.db
      - key: DEMO_DATABASE_URL
        value: file:/var/data/drishti-demo.db
      - key: STORAGE_ROOT
        value: /var/data/local-storage
      - key: PUBLIC_APP_URL
        value: https://drishti-eight-pearl.vercel.app
      - key: DRISHTI_DEMO_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: QR_SIGNING_SECRET
        sync: false
      # Optional: Suprsonic AI grading. Without it, AI assistance shows a
      # visible config error and manual evaluation still works.
      - key: SUPRSONIC_API_KEY
        sync: false
